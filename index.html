<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0a1a">
<title>Анатомия курицы</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0a1a;color:#e0e0ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;touch-action:manipulation;user-select:none;-webkit-user-select:none}
button{font-family:inherit;border:0;cursor:pointer;background:none;color:inherit}
img,svg,video{display:block;max-width:100%}
.app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#0d1525 0%,#0a0a1a 70%)}
.screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .5s ease}
.screen.active{opacity:1;pointer-events:auto}
.frame{position:relative;width:min(94vw,380px);height:min(98vh,760px);padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);display:flex;flex-direction:column}

#intro .frame{justify-content:center;align-items:center;text-align:center;gap:30px}
.btn-primary{padding:14px 32px;font-size:13px;font-weight:800;letter-spacing:2px;color:#00d4ff;background:rgba(5,10,20,0.85);border:2px solid #00d4ff;border-radius:50px;box-shadow:0 0 15px rgba(0,212,255,0.6),0 0 30px rgba(0,212,255,0.3),inset 0 0 10px rgba(0,212,255,0.1);animation:btnPulse 2s ease-in-out infinite;transition:all .3s ease;position:relative;text-transform:uppercase;z-index:10;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
@keyframes btnPulse{0%,100%{box-shadow:0 0 15px rgba(0,212,255,0.6),0 0 30px rgba(0,212,255,0.3),inset 0 0 10px rgba(0,212,255,0.1)}50%{box-shadow:0 0 25px rgba(0,212,255,0.9),0 0 50px rgba(0,212,255,0.5),inset 0 0 15px rgba(0,212,255,0.2)}}
.btn-primary:hover{border-radius:55px;transform:scale(1.05);box-shadow:0 0 35px rgba(0,212,255,1),0 0 70px rgba(0,212,255,0.6),inset 0 0 20px rgba(0,212,255,0.3)}
.btn-primary:active{transform:scale(0.97)}
.sound-btn{position:absolute;top:calc(14px + env(safe-area-inset-top));right:calc(14px + env(safe-area-inset-right));width:44px;height:44px;border-radius:50%;background:rgba(26,26,46,0.8);border:1px solid rgba(0,212,255,0.4);color:#00d4ff;font-size:20px;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:50}
.sound-btn:active{transform:scale(0.9)}

#game .frame{padding-top:calc(10px + env(safe-area-inset-top));padding-bottom:calc(10px + env(safe-area-inset-bottom))}
.game-header{display:flex;flex-direction:column;gap:10px;padding:0 8px;z-index:20}
.game-title{font-size:18px;font-weight:800;letter-spacing:2px;color:#00d4ff;text-align:center;text-shadow:0 0 12px rgba(0,212,255,0.4)}
.progress-row{display:flex;align-items:center;gap:10px;font-size:13px;color:#a0a0c0}
.progress-label{flex-shrink:0;font-weight:600}
.progress-bar{flex:1;height:8px;background:rgba(26,26,46,0.8);border-radius:10px;overflow:hidden;border:1px solid rgba(0,212,255,0.3)}
.progress-fill{height:100%;width:0%;background:linear-gradient(90deg,#00d4ff,#00ffcc);border-radius:10px;box-shadow:0 0 10px rgba(0,212,255,0.6);transition:width .6s cubic-bezier(.34,1.56,.64,1)}

.game-stage{position:relative;flex:1;margin-top:10px;border-radius:20px;overflow:hidden;background:#0a0a1a;border:1px solid rgba(0,212,255,0.3);box-shadow:inset 0 0 30px rgba(0,212,255,0.1),0 0 20px rgba(0,212,255,0.15);touch-action:none}
.layer-video{position:absolute;inset:0;z-index:1}
.layer-video video{width:100%;height:100%;object-fit:cover}
.layer-body{position:absolute;inset:0;z-index:2;-webkit-mask-image:radial-gradient(circle var(--radius,35px) at var(--x,50%) var(--y,50%),transparent 0%,transparent 85%,#000 100%);mask-image:radial-gradient(circle var(--radius,35px) at var(--x,50%) var(--y,50%),transparent 0%,transparent 85%,#000 100%)}
.layer-body img{width:100%;height:100%;object-fit:contain}
.flashlight-effect{position:absolute;width:calc(var(--radius,35px)*2);height:calc(var(--radius,35px)*2);left:var(--x,50%);top:var(--y,50%);transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;z-index:3;opacity:0;transition:opacity .3s ease}
.flashlight-effect.active{opacity:1}
.flashlight-effect::before{content:"";position:absolute;inset:0;border-radius:50%;border:1px solid rgba(0,212,255,0.5);box-shadow:0 0 8px rgba(0,212,255,0.4),inset 0 0 6px rgba(0,212,255,0.2);animation:ringPulse 1.5s ease-in-out infinite}
@keyframes ringPulse{0%,100%{box-shadow:0 0 8px rgba(0,212,255,0.4),inset 0 0 6px rgba(0,212,255,0.2)}50%{box-shadow:0 0 14px rgba(0,212,255,0.7),inset 0 0 10px rgba(0,212,255,0.35)}}
.flash-hint{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);font-size:11px;color:#00d4ff;background:rgba(10,10,26,0.7);padding:5px 12px;border-radius:16px;border:1px solid rgba(0,212,255,0.3);z-index:10;pointer-events:none;transition:opacity .5s ease;white-space:nowrap}
.flash-hint.hidden{opacity:0}

.zone{position:absolute;z-index:5;cursor:pointer;border-radius:50%;transition:all .3s ease;display:flex;align-items:center;justify-content:center}
.zone::before{content:"";position:absolute;inset:-4px;border-radius:50%;background:radial-gradient(circle,rgba(0,212,255,0.3) 0%,transparent 70%);opacity:0;transition:opacity .3s ease;animation:zoneGlow 2s ease-in-out infinite}
.zone:hover::before{opacity:1}
@keyframes zoneGlow{0%,100%{opacity:0.3}50%{opacity:0.8}}
.zone.found{pointer-events:auto}
.zone.hint{animation:zoneHint 1.8s ease-in-out infinite}
@keyframes zoneHint{0%,100%{box-shadow:0 0 0 0 rgba(0,212,255,0.6)}50%{box-shadow:0 0 0 14px rgba(0,212,255,0)}}

.zone-dot{position:absolute;width:26px;height:26px;border-radius:50%;background:rgba(0,212,255,0.25);border:2px solid rgba(0,212,255,0.8);box-shadow:0 0 12px rgba(0,212,255,0.6);pointer-events:none;z-index:6;animation:dotPulse 2s ease-in-out infinite}
@keyframes dotPulse{0%,100%{transform:scale(1);opacity:0.8}50%{transform:scale(1.3);opacity:1}}
.zone.found .zone-dot{display:none}

.zone.found::after{content:"\2713";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#00ffcc;font-size:22px;font-weight:900;text-shadow:0 0 12px rgba(0,255,204,0.9);animation:checkPop .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes checkPop{0%{transform:translate(-50%,-50%) scale(0);opacity:0}60%{transform:translate(-50%,-50%) scale(1.4);opacity:1}100%{transform:translate(-50%,-50%) scale(1);opacity:1}}

#zone-brain{left:28%;top:22%;width:14%;height:10%}
#zone-crop{left:28%;top:40%;width:14%;height:10%}
#zone-oviduct{left:52%;top:54%;width:14%;height:11%}
#zone-skeleton{left:48%;top:72%;width:14%;height:10%}

.quiz-btn{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom));right:calc(14px + env(safe-area-inset-right));width:50px;height:50px;border-radius:50%;background:#00d4ff;color:#0a0a1a;font-size:24px;font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:0 0 20px rgba(0,212,255,0.6);z-index:20;animation:quizPulse 2s ease-in-out infinite}
@keyframes quizPulse{0%,100%{box-shadow:0 0 20px rgba(0,212,255,0.6)}50%{box-shadow:0 0 30px rgba(0,212,255,0.9)}}
.quiz-btn:active{transform:scale(0.9)}

.modal-backdrop{position:fixed;inset:0;background:rgba(10,10,26,0.85);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:100;display:flex;align-items:center;justify-content:center;padding:18px;opacity:0;pointer-events:none;transition:opacity .35s ease}
.modal-backdrop.active{opacity:1;pointer-events:auto}
.modal{width:min(90vw,340px);max-height:82vh;background:linear-gradient(160deg,rgba(26,26,46,0.95),rgba(15,15,30,0.98));border:1px solid rgba(0,212,255,0.5);border-radius:22px;padding:18px 16px;box-shadow:0 0 0 1px rgba(0,212,255,0.2),0 18px 55px rgba(0,0,0,0.7),0 0 35px rgba(0,212,255,0.3);transform:scale(0.95);transition:transform .35s cubic-bezier(.34,1.56,.64,1);overflow-y:auto;-webkit-overflow-scrolling:touch}
.modal-backdrop.active .modal{transform:scale(1)}
.modal-icon{width:60px;height:60px;margin:0 auto 10px;border-radius:50%;background:radial-gradient(circle,rgba(0,212,255,0.2),transparent 70%);display:flex;align-items:center;justify-content:center;border:1px solid rgba(0,212,255,0.4);box-shadow:0 0 18px rgba(0,212,255,0.3)}
.modal-icon svg{width:38px;height:38px}
.modal-title{font-size:18px;font-weight:900;letter-spacing:1.5px;text-align:center;color:#00d4ff;margin-bottom:10px;text-shadow:0 0 12px rgba(0,212,255,0.4)}
.modal-video-wrap{width:100%;border-radius:10px;overflow:hidden;margin-bottom:12px;background:#0a0a1a;border:1px solid rgba(0,212,255,0.3)}
.modal-video-wrap video{width:100%;height:auto;max-height:180px;display:block;object-fit:contain;background:#000}
.modal-text{font-size:12px;line-height:1.55;color:#c0c0e0;text-align:left;margin-bottom:14px;white-space:pre-line}
.modal-stages{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.modal-stage{display:flex;align-items:flex-start;gap:8px;padding:8px 10px;background:rgba(0,212,255,0.06);border:1px solid rgba(0,212,255,0.15);border-radius:10px;font-size:11px;color:#c0c0e0;line-height:1.45}
.modal-stage-num{width:22px;height:22px;border-radius:50%;background:#00d4ff;color:#0a0a1a;font-weight:900;font-size:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.modal-close{width:100%;padding:12px;font-size:12px;font-weight:800;letter-spacing:1px;color:#0a0a1a;background:#00d4ff;border-radius:12px;box-shadow:0 6px 16px rgba(0,212,255,0.4)}
.modal-close:active{transform:scale(0.97)}

.quiz-progress{display:flex;justify-content:center;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.quiz-dot{width:8px;height:8px;border-radius:50%;background:rgba(0,212,255,0.3);border:1px solid rgba(0,212,255,0.5);transition:all .3s ease}
.quiz-dot.current{background:#00d4ff;box-shadow:0 0 10px #00d4ff;transform:scale(1.3)}
.quiz-dot.correct{background:#00ffcc;border-color:#00ffcc;box-shadow:0 0 10px #00ffcc}
.quiz-dot.wrong{background:#ff4466;border-color:#ff4466;box-shadow:0 0 10px #ff4466}
.quiz-question{font-size:15px;font-weight:700;line-height:1.5;color:#e0e0ff;text-align:center;margin-bottom:16px;min-height:46px}
.quiz-options{display:flex;flex-direction:column;gap:10px}
.quiz-option{padding:12px 14px;font-size:13px;font-weight:600;color:#e0e0ff;background:rgba(26,26,46,0.7);border:1px solid rgba(0,212,255,0.3);border-radius:11px;text-align:left;transition:all .25s ease;line-height:1.4}
.quiz-option:active:not(.disabled){transform:scale(0.98);background:rgba(0,212,255,0.12)}
.quiz-option.disabled{pointer-events:none;opacity:0.5}
.quiz-option.correct{background:rgba(0,255,204,0.15);border-color:#00ffcc;color:#00ffcc;box-shadow:0 0 14px rgba(0,255,204,0.5)}
.quiz-option.wrong{background:rgba(255,68,102,0.15);border-color:#ff4466;color:#ff4466;box-shadow:0 0 14px rgba(255,68,102,0.5);animation:shake .4s ease}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

#final .frame{justify-content:center;align-items:center;text-align:center;gap:16px}
.final-chicken{width:200px;height:260px;object-fit:contain;filter:drop-shadow(0 0 30px rgba(0,212,255,0.6)) drop-shadow(0 0 60px rgba(0,212,255,0.3));animation:finalFloat 3s ease-in-out infinite}
@keyframes finalFloat{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-8px) scale(1.03)}}
.final-title{font-size:clamp(22px,6vw,28px);font-weight:900;letter-spacing:2px;color:#00d4ff;text-shadow:0 0 20px rgba(0,212,255,0.5);line-height:1.2}
.final-score{font-size:48px;font-weight:900;color:#00ffcc;text-shadow:0 0 25px rgba(0,255,204,0.6);line-height:1}
.final-score-label{font-size:13px;color:#a0a0c0;letter-spacing:1px;margin-top:4px}
.final-message{font-size:14px;line-height:1.6;color:#c0c0e0;max-width:300px;margin:0 auto}
.final-buttons{display:flex;flex-direction:column;gap:12px;width:100%;max-width:270px}

.intro-video-wrap{position:absolute;inset:0;width:100%;height:100%;z-index:1;display:flex;align-items:center;justify-content:center;overflow:hidden}
.intro-video-wrap video{width:100%;height:100%;object-fit:contain;image-rendering:-webkit-optimize-contrast;image-rendering:crisp-edges}
.intro-overlay{position:absolute;inset:0;z-index:2;background:radial-gradient(ellipse at center,rgba(5,10,20,0.25) 0%,rgba(5,10,20,0.55) 100%);pointer-events:none}
</style>
</head>
<body>
<div class="app">

<section id="intro" class="screen active">
<div class="intro-video-wrap">
  <video id="introVideo" src="intro-bg.mp4" autoplay playsinline></video>
</div>
<div class="intro-overlay"></div>
<div class="frame">
<button class="sound-btn" id="soundBtn" aria-label="Звук">&#x1F50A;</button>
<button class="btn-primary" id="startBtn">НАЧАТЬ ИССЛЕДОВАНИЕ</button>
</div>
</section>

<section id="game" class="screen">
<div class="frame">
<button class="sound-btn" id="soundBtn2" aria-label="Звук">&#x1F50A;</button>
<div class="game-header">
<div class="game-title">АНАТОМИЯ КУРИЦЫ</div>
<div class="progress-row">
<span class="progress-label">Изучено: <span id="progressCount">0</span> / 4</span>
<div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
</div>
</div>

<div class="game-stage" id="gameStage">
<video class="layer-video" id="organsVideo" src="chicken-organs.mp4" autoplay loop playsinline muted></video>

<img class="layer-body" id="layerBody" src="chicken-body.jpg" alt="Курица" style="--x:50%;--y:50%;--radius:35px">

<div class="flashlight-effect" id="flashEffect"></div>
<div class="flash-hint" id="flashHint">Нажми на орган курицы</div>

<div class="zone" id="zone-brain" data-zone="brain" aria-label="Мозг">
  <div class="zone-dot"></div>
</div>
<div class="zone" id="zone-crop" data-zone="crop" aria-label="Зоб">
  <div class="zone-dot"></div>
</div>
<div class="zone" id="zone-oviduct" data-zone="oviduct" aria-label="Яйцо">
  <div class="zone-dot"></div>
</div>
<div class="zone" id="zone-skeleton" data-zone="skeleton" aria-label="Кость">
  <div class="zone-dot"></div>
</div>
</div>

<button class="quiz-btn" id="quizBtn" aria-label="Проверить знания">?</button>
</div>
</section>

<div class="modal-backdrop" id="organModal">
<div class="modal">
<div class="modal-icon" id="modalIcon"></div>
<h2 class="modal-title" id="modalTitle"></h2>
<div class="modal-video-wrap">
  <video id="modalVideo" controls playsinline preload="auto"></video>
</div>
<div id="modalStages"></div>
<p class="modal-text" id="modalText"></p>
<button class="modal-close" id="modalClose">ЗАКРЫТЬ</button>
</div>
</div>

<div class="modal-backdrop" id="quizModal">
<div class="modal">
<div class="quiz-progress" id="quizProgress"></div>
<div class="quiz-question" id="quizQuestion"></div>
<div class="quiz-options" id="quizOptions"></div>
</div>
</div>

<section id="final" class="screen">
<div class="frame">
<img class="final-chicken" id="finalChicken" src="final-chicken.png" alt="Курица">
<h1 class="final-title">ИССЛЕДОВАНИЕ<br>ЗАВЕРШЕНО!</h1>
<div class="final-score" id="finalScore">0 / 12</div>
<div class="final-score-label">ПРАВИЛЬНЫХ ОТВЕТОВ</div>
<p class="final-message" id="finalMessage"></p>
<div class="final-buttons">
<button class="btn-primary" id="replayBtn">НАЧАТЬ ЗАНОВО</button>
</div>
</div>
</section>

</div>

<script>
(function(){
'use strict';

var ORGANS = {
brain: {
title: 'МОЗГ',
icon: '<svg viewBox="0 0 50 50" fill="none" stroke="#00d4ff" stroke-width="2"><ellipse cx="25" cy="22" rx="14" ry="12"/><path d="M14 18 Q25 22 36 18" stroke-width="1" opacity="0.5"/><path d="M14 26 Q25 22 36 26" stroke-width="1" opacity="0.5"/><line x1="25" y1="34" x2="25" y2="44" stroke-width="2"/></svg>',
text: 'Мозг курицы весит всего 3-4 грамма, но управляет всем телом!\n\nОн получает сигналы от глаз и ушей, а потом отправляет команды мышцам. Благодаря мозгу курица бегает, клюёт зёрна и узнаёт других кур.\n\nМозжечок отвечает за равновесие — поэтому курица может стоять на одной ноге и не падать, даже когда спит!\n\nКурицы умнее, чем кажутся: они помнят до 100 сородичей и лица людей.',
video: 'brain.mp4',
stages: null
},
crop: {
title: 'ЗОБ',
icon: '<svg viewBox="0 0 50 50" fill="none" stroke="#00d4ff" stroke-width="2"><path d="M25 5 L25 15"/><ellipse cx="25" cy="25" rx="12" ry="10" fill="rgba(0,212,255,0.15)"/><path d="M25 35 L25 45"/><circle cx="22" cy="23" r="2" fill="#FFE45C" opacity="0.6"/><circle cx="28" cy="26" r="1.5" fill="#FFE45C" opacity="0.6"/></svg>',
text: 'Зоб — это мешочек в шее курицы, где хранится еда.\n\nКурица ест быстро, почти не жуя. Зёрна попадают в зоб, там размягчаются и потом идут в желудок.\n\nЗачем это нужно? Курица — добыча для хищников. Быстро набить зоб и убежать лучше, чем долго есть на открытом месте!\n\nКогда курица сыта, зоб раздувается. За ночь он обычно пустеет.',
video: 'crop.mp4',
stages: null
},
skeleton: {
title: 'КОСТЬ',
icon: '<svg viewBox="0 0 50 50" fill="none" stroke="#00d4ff" stroke-width="1.5"><circle cx="25" cy="8" r="5"/><line x1="25" y1="13" x2="25" y2="35"/><line x1="18" y1="18" x2="32" y2="18"/><line x1="19" y1="22" x2="31" y2="22"/><line x1="25" y1="35" x2="18" y2="46"/><line x1="25" y1="35" x2="32" y2="46"/></svg>',
text: 'Скелет курицы сильно отличается от нашего!\n\nГлавное — кости курицы полые внутри, в них воздух. Поэтому скелет лёгкий, но прочный. Это помогает птицам летать.\n\nМногие кости сращены между собой — например, кости таза и позвоночника. А шея очень гибкая: в ней 14 позвонков (у нас всего 7), поэтому курица поворачивает голову почти на 180°!\n\nНа грудной кости есть выступ — киль. К нему крепятся сильные мышцы.',
video: 'skeleton.mp4',
stages: null
},
oviduct: {
title: 'ЯЙЦЕВОД',
icon: '<svg viewBox="0 0 50 50" fill="none" stroke="#00d4ff" stroke-width="2"><circle cx="15" cy="12" r="6" fill="#FFE45C" stroke="#FFB703"/><path d="M15 18 Q25 22 20 30 Q15 38 25 42 Q35 46 35 38" stroke-width="1.5"/><ellipse cx="35" cy="36" rx="7" ry="9" fill="rgba(255,228,92,0.2)" stroke="#FFE45C"/></svg>',
text: 'Яйцевод — трубка, где желток превращается в яйцо. Весь путь занимает 24-26 часов!\n\nУ курицы работает только левый яичник и яйцевод. Правый исчез, чтобы уменьшить вес.\n\nЭтапы формирования яйца:\n\nЖелток созревает 7-10 дней и попадает в яйцевод. Здесь может произойти оплодотворение.\n\nЖелток обволакивается белком. Белок защищает и содержит питательные вещества. Это длится 3 часа.\n\nФормируются две тонкие оболочки под скорлупой.',
video: 'oviduct.mp4',
stages: null
}
};

var QUESTIONS = [
{q:'🧠 МОЗГ: Сколько весит мозг курицы?',options:[{text:'3-4 грамма',correct:true},{text:'30-40 грамм',correct:false},{text:'100 грамм',correct:false},{text:'1 грамм',correct:false}]},
{q:'🧠 МОЗГ: За что отвечает мозжечок курицы?',options:[{text:'За зрение',correct:false},{text:'За равновесие',correct:true},{text:'За пищеварение',correct:false},{text:'За дыхание',correct:false}]},
{q:' МОЗГ: Сколько сородичей может помнить курица?',options:[{text:'До 10',correct:false},{text:'До 50',correct:false},{text:'До 100',correct:true},{text:'До 1000',correct:false}]},
{q:' ЗОБ: Что такое зоб у курицы?',options:[{text:'Мешочек в шее, где хранится еда',correct:true},{text:'Часть крыла',correct:false},{text:'Орган дыхания',correct:false},{text:'Часть ноги',correct:false}]},
{q:'🟡 ЗОБ: Почему курица ест быстро, почти не жуя?',options:[{text:'Чтобы набить зоб и убежать от хищников',correct:true},{text:'Потому что у неё болят зубы',correct:false},{text:'Чтобы быстрее уснуть',correct:false},{text:'Потому что еда горячая',correct:false}]},
{q:'🟡 ЗОБ: Что происходит с зобом за ночь?',options:[{text:'Он раздувается ещё больше',correct:false},{text:'Он обычно пустеет',correct:true},{text:'Он превращается в желудок',correct:false},{text:'Ничего не происходит',correct:false}]},
{q:'🦴 КОСТИ: Чем кости курицы отличаются от человеческих?',options:[{text:'Они полые внутри, в них воздух',correct:true},{text:'Они заполнены костным мозгом, как у нас',correct:false},{text:'Они полностью состоят из хрящей',correct:false},{text:'Они в 10 раз тяжелее',correct:false}]},
{q:' КОСТИ: Сколько позвонков в шее курицы?',options:[{text:'7, как у человека',correct:false},{text:'10',correct:false},{text:'14',correct:true},{text:'20',correct:false}]},
{q:'🦴 КОСТИ: Что такое киль?',options:[{text:'Часть крыла',correct:false},{text:'Выступ на грудной кости, к которому крепятся мышцы',correct:true},{text:'Кость ноги',correct:false},{text:'Часть черепа',correct:false}]},
{q:'🥚 ЯЙЦЕВОД: Сколько времени занимает путь желтка до готового яйца?',options:[{text:'3 часа',correct:false},{text:'7-10 дней',correct:false},{text:'24-26 часов',correct:true},{text:'1-2 часа',correct:false}]},
{q:' ЯЙЦЕВОД: Сколько яичников и яйцеводов работает у курицы?',options:[{text:'Оба — левый и правый',correct:false},{text:'Только левый',correct:true},{text:'Только правый',correct:false},{text:'Ни одного',correct:false}]},
{q:' ЯЙЦЕВОД: Сколько времени желток обволакивается белком?',options:[{text:'1 час',correct:false},{text:'3 часа',correct:true},{text:'7-10 дней',correct:false},{text:'24 часа',correct:false}]}
];

var STATE = {found: new Set(), quizIndex: 0, quizScore: 0, quizAnswered: false, soundOn: true, hintTimer: null, currentHint: null, videoStarted: false, musicStarted: false, bgMusicVolume: 0.3};
var quizResults = [];

var $ = function(s){return document.querySelector(s)};
var $$ = function(s){return document.querySelectorAll(s)};

function showScreen(id){
$$('.screen').forEach(function(s){s.classList.remove('active')});
var t = document.getElementById(id);
if(t) t.classList.add('active');
}

function updateProgress(){
var c = STATE.found.size;
$('#progressCount').textContent = c;
$('#progressFill').style.width = (c/4*100)+'%';
}

var stage = $('#gameStage');
var layerBody = $('#layerBody');
var flashEffect = $('#flashEffect');
var flashHint = $('#flashHint');
var pointerActive = false;
var hintHidden = false;

function updateFlash(cx, cy){
var r = stage.getBoundingClientRect();
var x = cx - r.left;
var y = cy - r.top;
var px = (x/r.width)*100;
var py = (y/r.height)*100;
var rad = Math.max(20, Math.min(35, r.width*0.10));
layerBody.style.setProperty('--x', px+'%');
layerBody.style.setProperty('--y', py+'%');
layerBody.style.setProperty('--radius', rad+'px');
flashEffect.style.setProperty('--x', px+'%');
flashEffect.style.setProperty('--y', py+'%');
flashEffect.style.setProperty('--radius', rad+'px');
flashEffect.classList.add('active');
if(!hintHidden){flashHint.classList.add('hidden'); hintHidden = true;}
}

function onMove(e){
if(!stage.contains(e.target) && e.target !== stage) return;
e.preventDefault();
var cx, cy;
if(e.touches && e.touches.length){cx=e.touches[0].clientX; cy=e.touches[0].clientY;}
else{cx=e.clientX; cy=e.clientY;}
updateFlash(cx, cy);
}
function onEnd(){setTimeout(function(){if(!pointerActive) flashEffect.classList.remove('active');},500);}

stage.addEventListener('pointerdown', function(e){pointerActive=true; onMove(e);});
stage.addEventListener('pointermove', function(e){if(pointerActive||e.buttons>0) onMove(e);});
stage.addEventListener('pointerup', function(){pointerActive=false; onEnd();});
stage.addEventListener('pointercancel', function(){pointerActive=false; onEnd();});
stage.addEventListener('pointerleave', function(){pointerActive=false; onEnd();});

function lowerBgMusic(){
var audio = document.getElementById('bgMusic');
if(audio){audio.volume = 0.05;}
}

function restoreBgMusic(){
var audio = document.getElementById('bgMusic');
if(audio && STATE.soundOn){audio.volume = STATE.bgMusicVolume;}
}

function openModal(key){
var d = ORGANS[key];
if(!d) return;
$('#modalIcon').innerHTML = d.icon;
$('#modalTitle').textContent = d.title;
$('#modalText').textContent = d.text;
var v = $('#modalVideo');
v.src = d.video || '';
v.load();
v.play().then(function(){
  console.log('Видео органа запущено: ' + d.video);
}).catch(function(e){
  console.log('Автозапуск видео заблокирован: ' + e.message);
});
var sc = $('#modalStages');
sc.innerHTML = '';
if(d.stages && d.stages.length){
var html = '';
d.stages.forEach(function(s, i){
html += '<div class="modal-stage"><div class="modal-stage-num">'+(i+1)+'</div><div>'+s+'</div></div>';
});
sc.innerHTML = html;
}
$('#organModal').classList.add('active');
lowerBgMusic();
}

function closeModal(){
$('#organModal').classList.remove('active');
var v = $('#modalVideo');
v.pause();
v.removeAttribute('src');
v.load();
restoreBgMusic();
}

$$('.zone').forEach(function(z){
z.addEventListener('click', function(e){
e.stopPropagation();
var k = z.getAttribute('data-zone');
if(!STATE.found.has(k)){
  STATE.found.add(k);
  z.classList.add('found');
  updateProgress();
  clearHint();
}
openModal(k);
});
});

$('#modalClose').addEventListener('click', closeModal);
$('#organModal').addEventListener('click', function(e){if(e.target.id==='organModal') closeModal();});

function clearHint(){
if(STATE.hintTimer){clearTimeout(STATE.hintTimer); STATE.hintTimer=null;}
if(STATE.currentHint){STATE.currentHint.classList.remove('hint'); STATE.currentHint=null;}
}
function startHint(){
clearHint();
STATE.hintTimer = setTimeout(function(){
var unfound = Object.keys(ORGANS).filter(function(k){return !STATE.found.has(k);});
if(!unfound.length) return;
var k = unfound[Math.floor(Math.random()*unfound.length)];
var z = document.getElementById('zone-'+k);
if(z && !STATE.found.has(k)){
z.classList.add('hint');
STATE.currentHint = z;
setTimeout(function(){if(STATE.currentHint===z){z.classList.remove('hint'); STATE.currentHint=null;}},4000);
}
startHint();
}, 8000);
}

function openQuiz(){
STATE.quizIndex=0; STATE.quizScore=0; quizResults.length=0;
renderQP(); renderQ();
$('#quizModal').classList.add('active');
}
function closeQuiz(){$('#quizModal').classList.remove('active');}

function renderQP(){
var c=$('#quizProgress'); c.innerHTML='';
for(var i=0;i<QUESTIONS.length;i++){
var d=document.createElement('div'); d.className='quiz-dot';
if(i===STATE.quizIndex) d.classList.add('current');
c.appendChild(d);
}
}
function renderQ(){
var q=QUESTIONS[STATE.quizIndex];
$('#quizQuestion').textContent=q.q;
var o=$('#quizOptions'); o.innerHTML='';
STATE.quizAnswered=false;
q.options.forEach(function(opt){
var b=document.createElement('button');
b.className='quiz-option';
b.textContent=opt.text;
b.addEventListener('click',function(){handleAns(b,opt);});
o.appendChild(b);
});
}
function handleAns(btn, opt){
if(STATE.quizAnswered) return;
STATE.quizAnswered=true;
var all=$$('#quizOptions .quiz-option');
all.forEach(function(b){b.classList.add('disabled');});
if(opt.correct){
btn.classList.add('correct');
STATE.quizScore++;
} else {
btn.classList.add('wrong');
all.forEach(function(b){
var q=QUESTIONS[STATE.quizIndex];
var co=q.options.find(function(o){return o.correct;});
if(co && co.text===b.textContent) b.classList.add('correct');
});
}
quizResults[STATE.quizIndex]=opt.correct;
var dots=$$('#quizProgress .quiz-dot');
if(dots[STATE.quizIndex]){dots[STATE.quizIndex].classList.remove('current'); dots[STATE.quizIndex].classList.add(opt.correct?'correct':'wrong');}
setTimeout(function(){
STATE.quizIndex++;
if(STATE.quizIndex<QUESTIONS.length){
renderQP();
var nd=$$('#quizProgress .quiz-dot');
quizResults.forEach(function(r,i){if(i<STATE.quizIndex&&nd[i]){nd[i].classList.remove('current');nd[i].classList.add(r?'correct':'wrong');}});
renderQ();
} else { finishQuiz(); }
},1200);
}
function finishQuiz(){
closeQuiz();
$('#finalScore').textContent=STATE.quizScore+' / 12';
var m='';
if(STATE.quizScore===12) m='Потрясающе! Ты настоящий эксперт по анатомии курицы!';
else if(STATE.quizScore>=9) m='Отличный результат! Ты многое узнал о курице.';
else if(STATE.quizScore>=6) m='Хороший результат! Но есть что повторить.';
else if(STATE.quizScore>=3) m='Неплохое начало! Попробуй изучить курицу ещё раз.';
else m='Не расстраивайся! Исследуй курицу ещё раз и попробуй снова.';
$('#finalMessage').textContent=m;
showScreen('final');
}

function startIntroVideo(){
if(STATE.videoStarted) return;
STATE.videoStarted = true;
var v = $('#introVideo');
if(!v) return;
v.muted = false;
v.volume = 1.0;
var p = v.play();
if(p && p.then){
  p.then(function(){console.log('Видео заставки запущено со звуком');}).catch(function(){
    v.muted = true;
    v.play().then(function(){console.log('Видео заставки запущено без звука');}).catch(function(e){console.log('Видео не запустилось:', e);});
  });
}
}

function stopIntroVideo(){
var v = $('#introVideo');
if(!v) return;
v.pause();
v.muted = true;
v.currentTime = 0;
}

function startBgMusic(){
if(STATE.musicStarted) return;
STATE.musicStarted = true;
var audio = new Audio('bg-music.mp3');
audio.loop = true;
audio.volume = STATE.bgMusicVolume;
audio.id = 'bgMusic';
document.body.appendChild(audio);
audio.play().then(function(){
  console.log('Фоновая музыка запущена');
}).catch(function(e){
  console.log('Музыка не запустилась:', e);
});
}

$('#startBtn').addEventListener('click', function(){
stopIntroVideo();
startBgMusic();
setTimeout(function(){showScreen('game'); startHint();}, 200);
});
$('#quizBtn').addEventListener('click', function(){openQuiz();});
$('#replayBtn').addEventListener('click', function(){location.reload();});

function toggleSound(){
STATE.soundOn=!STATE.soundOn;
var ic=STATE.soundOn?'\uD83D\uDD0A':'\uD83D\uDD07';
$('#soundBtn').textContent=ic;
$('#soundBtn2').textContent=ic;
var v=$('#introVideo');
if(v && !v.paused) v.muted = !STATE.soundOn;
var audio = document.getElementById('bgMusic');
if(audio){
  if(STATE.soundOn){
    audio.volume = STATE.bgMusicVolume;
    audio.muted = false;
  } else {
    audio.muted = true;
  }
}
}
$('#soundBtn').addEventListener('click', function(){startIntroVideo(); toggleSound();});
$('#soundBtn2').addEventListener('click', toggleSound);

function init(){
var firstInteraction = function(){
startIntroVideo();
document.removeEventListener('click', firstInteraction);
document.removeEventListener('touchstart', firstInteraction);
document.removeEventListener('keydown', firstInteraction);
};
document.addEventListener('click', firstInteraction);
document.addEventListener('touchstart', firstInteraction);
document.addEventListener('keydown', firstInteraction);

setTimeout(function(){
var v = $('#introVideo');
if(v){v.play().then(function(){}).catch(function(){});}
}, 300);

var lt=0;
document.addEventListener('touchend',function(e){var n=Date.now();if(n-lt<300)e.preventDefault();lt=n;},{passive:false});
document.addEventListener('contextmenu',function(e){e.preventDefault();});
document.addEventListener('gesturestart',function(e){e.preventDefault();});
document.addEventListener('gesturechange',function(e){e.preventDefault();});
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',init);
else init();

})();
</script>
</body>
</html>
